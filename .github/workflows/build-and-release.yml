name: Build and release

on:
  schedule:
    # Weekly, at a non-round offset - avoid the top of the hour, which is when a large
    # fraction of all scheduled GitHub Actions jobs fire by default.
    - cron: '37 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  resolve-versions:
    runs-on: ubuntu-latest
    outputs:
      stable_tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        run: |
          TAG=$(gh api repos/adafruit/circuitpython/releases/latest --jq .tag_name)
          echo "Latest stable tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: resolve-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main
            ref: main
          - name: stable
            ref: ${{ needs.resolve-versions.outputs.stable_tag }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout circuitpython at ${{ matrix.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adafruit/circuitpython
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          path: cp

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Compute version string
        id: version
        working-directory: cp
        run: |
          VERSION=$(python py/version.py)
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release
        id: check
        run: |
          if gh release view "${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.version }} already exists - nothing new to build."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # Everything below only runs when there's actually a new version to publish - this is
      # the whole point of checking the version string before any of the expensive ESP-IDF
      # setup/build steps, not after them.

      - name: Build
        if: steps.check.outputs.exists != 'true'
        run: ./scripts/build.sh cp

      - name: Rename release files
        # Follows Adafruit's own naming convention for CircuitPython release files (see
        # adafruit-circuit-python.s3.amazonaws.com), minus the "adafruit-" prefix since these
        # aren't Adafruit's own builds: circuitpython-<board>-<locale>-<version>.<ext>
        if: steps.check.outputs.exists != 'true'
        id: rename
        run: |
          BOARD=bionebicine_pds_2026
          LOCALE=en_US
          BUILD_DIR="cp/ports/espressif/build-$BOARD"
          NAME="circuitpython-$BOARD-$LOCALE-${{ steps.version.outputs.version }}"
          cp "$BUILD_DIR/firmware.bin" "$BUILD_DIR/$NAME.bin"
          cp "$BUILD_DIR/firmware.uf2" "$BUILD_DIR/$NAME.uf2"
          echo "bin_path=$BUILD_DIR/$NAME.bin" >> "$GITHUB_OUTPUT"
          echo "uf2_path=$BUILD_DIR/$NAME.uf2" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.check.outputs.exists != 'true'
        run: |
          SHA=$(git -C cp rev-parse HEAD)
          gh release create "${{ steps.version.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --latest \
            --title "${{ steps.version.outputs.version }}" \
            --notes "Built from adafruit/circuitpython@$SHA (${{ matrix.name }})." \
            "${{ steps.rename.outputs.bin_path }}" \
            "${{ steps.rename.outputs.uf2_path }}"
        env:
          GH_TOKEN: ${{ github.token }}
